[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "officecli-html-to-pptx"
version = "0.2.0"
description = "Build new editable PowerPoint decks from Contract-checked Author HTML through OfficeCLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Design Arena" }]
keywords = ["pptx", "powerpoint", "html", "slides", "officecli", "presentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Typing :: Typed",
]
dependencies = [
    "playwright==1.62.0",
    "lxml>=5.0.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
officecli-html-to-pptx = "officecli_html_to_pptx.cli:main"

[project.urls]
Homepage = "https://github.com/Design-Arena/html-to-pptx"
Repository = "https://github.com/Design-Arena/html-to-pptx"
Issues = "https://github.com/Design-Arena/html-to-pptx/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/officecli_html_to_pptx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
