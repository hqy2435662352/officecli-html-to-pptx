<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>V05-01-01 native text structure</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; }
    .slide {
      position: relative;
      display: none;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #f8fafc;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    .slide.active { display: block; }
    .text {
      position: absolute;
      left: 120px;
      top: 120px;
      width: 1680px;
      height: 760px;
      color: #24324a;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      font-size: 30px;
      line-height: 1.35;
      direction: ltr;
      text-align: left;
    }
    .text p { margin: 0 0 12px 0; min-height: 40.5px; }
    .text p:last-child { margin-bottom: 0; }
    .mixed { font-weight: 700; color: #0f6b78; }
    .rtl { direction: rtl; text-align: right; }
  </style>
</head>
<body>
  <main>
    <section class="slide active" aria-label="V05-01-01 native text structure">
      <div class="text" id="native-text">
        <p></p>
        <p>第一段 <span class="mixed">mixed run</span> before<br>hard break after</p>
        <p></p>
        <p>第三段：中文字体与软换行保持可编辑。</p>
        <p class="rtl" style="line-height: 30px; margin-top: 0; margin-bottom: 0;">اتجاه RTL</p>
        <p>trailing paragraph</p>
        <p></p>
        <p></p>
      </div>
    </section>
  </main>
</body>
</html>
