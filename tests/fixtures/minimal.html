<!DOCTYPE html>
<html>
<head>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    .slide {
        width: 1920px;
        height: 1080px;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
    }
    .slide.active { display: flex; }
</style>
</head>
<body>

<section class="slide active" style="background-color: #1e293b;">
    <h1 style="font-size: 64px; color: #f8fafc;">Title Slide</h1>
    <p style="font-size: 24px; color: #94a3b8;">Subtitle text here</p>
</section>

<section class="slide" style="background-color: #ffffff;">
    <h2 style="font-size: 48px; color: #0f172a;">Content Slide</h2>
    <p style="font-size: 22px; color: #475569; max-width: 800px; text-align: center;">
        This is a minimal two-slide deck for testing the converter.
    </p>
</section>

</body>
</html>
