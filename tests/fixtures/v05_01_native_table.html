<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      .slide {
        width: 960px;
        height: 540px;
        display: none;
        position: relative;
        background: #ffffff;
      }
      .slide.active { display: block; }
      table {
        position: absolute;
        left: 80px;
        top: 54px;
        width: 600px;
        height: 300px;
        table-layout: fixed;
        border-collapse: collapse;
        font-family: Arial, sans-serif;
      }
      th, td {
        height: 60px;
        padding: 8px;
        text-align: center;
        vertical-align: middle;
        border: 2px solid #334155;
        font-size: 16px;
        line-height: 1.25;
      }
      th { background: #dbeafe; font-weight: 700; }
      td { background: #f8fafc; }
      tr:nth-child(4) td:nth-child(1) { width: 150px; }
      tr:nth-child(4) td:nth-child(2) { width: 200px; }
      tr:nth-child(4) td:nth-child(3) { width: 250px; }
      .anchor { background: #fef3c7; text-align: left; }
      .horizontal { background: #dcfce7; }
      .covered-content { color: #b91c1c; }
    </style>
  </head>
  <body>
    <section class="slide active">
      <table aria-label="native merged table">
        <thead>
          <tr>
            <th rowspan="2" colspan="2" class="anchor">
              <p>Combined anchor <strong>owned</strong></p>
            </th>
            <th>Header</th>
          </tr>
          <tr>
            <td>Vertical follower</td>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="2" class="horizontal">Horizontal region</td>
            <td>Ordinary cell</td>
          </tr>
          <tr>
            <td>Column one</td>
            <td>Column two</td>
            <td>Column three</td>
          </tr>
        </tbody>
      </table>
    </section>
  </body>
</html>
