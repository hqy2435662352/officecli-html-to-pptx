<!doctype html>
<html><head><style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  .slide { width: 1920px; height: 1080px; position: relative; background: #ffffff; }
  .shape {
    position: absolute; width: 210px; height: 92px; padding: 12px;
    border: 3px solid #223344; background: #dceeff; color: #17212b;
    font-family: Arial, sans-serif; font-size: 18px; line-height: 1.2;
  }
</style></head><body><section class="slide active">
  <div class="shape" data-pptx-shape-geometry="rect" style="left:40px;top:40px">Rect label</div>
  <div class="shape" data-pptx-shape-geometry="roundRect" style="left:280px;top:40px;border-radius:18px"></div>
  <div class="shape" data-pptx-shape-geometry="ellipse" style="left:520px;top:40px;border-radius:50%"></div>
  <div class="shape" data-pptx-shape-geometry="triangle" style="left:760px;top:40px"></div>
  <div class="shape" data-pptx-shape-geometry="diamond" style="left:1000px;top:40px"></div>
  <div class="shape" data-pptx-shape-geometry="parallelogram" style="left:1240px;top:40px"></div>
  <div class="shape" data-pptx-shape-geometry="chevron" style="left:1480px;top:40px"></div>
  <div class="shape" data-pptx-shape-geometry="hexagon" style="left:40px;top:190px"></div>
  <div class="shape" data-pptx-shape-geometry="leftArrow" style="left:280px;top:190px"></div>
  <div class="shape" data-pptx-shape-geometry="rightArrow" style="left:520px;top:190px"></div>
  <div class="shape" data-pptx-shape-geometry="upArrow" style="left:760px;top:190px"></div>
  <div class="shape" data-pptx-shape-geometry="downArrow" style="left:1000px;top:190px"></div>
  <div class="shape" data-pptx-shape-geometry="star5" style="left:1240px;top:190px"></div>
  <div class="shape" style="left:1480px;top:190px;border-radius:50%;width:92px;height:92px"></div>
  <div class="shape" style="left:40px;top:340px;opacity:.55;transform:rotate(17deg);width:280px">rotated opaque shape 中文</div>
</section></body></html>
