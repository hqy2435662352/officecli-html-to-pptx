name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Wire the repository's own gate
        # `core.hooksPath` lives in `.git/config`, which a clone does not carry, so
        # a fresh checkout has no guard until this runs once.  The suite asserts the
        # checkout it runs in *is* wired -- that assertion is the point of the gate,
        # and it is what caught a clean checkout with no guard at all -- so CI has to
        # wire it rather than the test having to tolerate an unwired clone.
        run: |
          python scripts/install_hooks.py
          python scripts/install_hooks.py --check

      - name: Run tests
        run: pytest -v
